# copy scripts to digitalocean and run docker-compose

name: deploy

on: [push]

jobs:
  deploy_production:
    if: startsWith(github.ref, 'refs/tags/')
    name: production deployment to digitalocean.com
    runs-on: ubuntu-latest
    steps:
      - name: check out the repo
        uses: actions/checkout@v2

      - name: copy files
        uses: alinz/ssh-scp-action@master
        with:
          key: ${{ secrets.DEPLOY_KEY }}
          host: ${{ secrets.APP_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh_before: |
            echo 'PRODUCTION: deploying ${{ github.ref }}'
            mkdir -p /var/gendercomics/auth-server

          scp: |
            ./docker-compose.yml ${{ secrets.DEPLOY_USER }}@${{ secrets.APP_HOST }}:/var/gendercomics/auth-server/docker-compose.yml
            ./docker-compose.infra.yml ${{ secrets.DEPLOY_USER }}@${{ secrets.APP_HOST }}:/var/gendercomics/auth-server/docker-compose.infra.yml
            ./traefik.yml ${{ secrets.DEPLOY_USER }}@${{ secrets.APP_HOST }}:/var/gendercomics/auth-server/traefik.yml
            ./setup.sh ${{ secrets.DEPLOY_USER }}@${{ secrets.APP_HOST }}:/var/gendercomics/auth-server/setup.sh
            ./cleanup.sh ${{ secrets.DEPLOY_USER }}@${{ secrets.APP_HOST }}:/var/gendercomics/auth-server/cleanup.sh

          ssh_after: |
            chmod +x /var/gendercomics/auth-server/setup.sh /var/gendercomics/auth-server/cleanup.sh
            /var/gendercomics/auth-server/setup.sh
            echo 'DONE!!!'
